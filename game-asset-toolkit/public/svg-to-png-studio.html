<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SVG to PNG Studio</title>
  <style>html,body{margin:0;height:100%;background:#f6f7f9;font:14px/1.5 system-ui,sans-serif;color:#17232b}</style>
</head>
<body>
  <p id="status" style="padding:24px">Loading SVG to PNG Studio…</p>
  <script>
  (async function () {
    var status = document.getElementById('status');
    try {
      var urls = [
        '/svg-studio-chunk-0.txt',
        '/svg-studio-chunk-1.txt',
        '/svg-studio-chunk-2.txt',
        '/svg-studio-chunk-3.txt',
        '/svg-studio-chunk-4.txt'
      ];
      var parts = await Promise.all(urls.map(function (u) {
        return fetch(u).then(function (r) {
          if (!r.ok) throw new Error(u + ' ' + r.status);
          return r.text();
        });
      }));
      var html = parts.join('');
      document.open('text/html');
      document.write(html);
      document.close();
    } catch (e) {
      status.textContent = 'Failed to load studio: ' + (e && e.message ? e.message : e);
      status.style.color = '#ab3b32';
    }
  })();
  </script>
</body>
</html>
